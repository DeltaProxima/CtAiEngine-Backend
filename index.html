<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Upload with Coordinates</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body class="bg-gradient-to-r from-blue-100 to-purple-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-lg shadow-xl p-8 max-w-3xl w-full">
        <h1 class="text-3xl font-bold mb-6 text-center text-gray-800">
            Image Upload
        </h1>
        <form id="uploadForm" class="space-y-4">
            <div>
                <label for="image" class="block text-sm font-medium text-gray-700 mb-1">Image</label>
                <input type="file" id="image" name="image" accept="image/*" required
                    class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label for="latitude" class="block text-sm font-medium text-gray-700 mb-1">Latitude</label>
                    <input type="number" id="latitude" name="latitude" step="any" required
                        class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
                </div>
                <div>
                    <label for="longitude" class="block text-sm font-medium text-gray-700 mb-1">Longitude</label>
                    <input type="number" id="longitude" name="longitude" step="any" required
                        class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
                </div>
            </div>
            <button type="submit"
                class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition duration-150 ease-in-out">
                Submit
            </button>
        </form>
        <div id="loading" class="hidden mt-4 text-center">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-t-2 border-b-2 border-blue-500"></div>
            <p class="mt-2 text-gray-600">Processing...</p>
        </div>
        <div id="response2" class="bg-white rounded-lg shadow-xl p-8 max-w-2xl w-full hidden">
            <h1 class="text-3xl font-bold mb-6 text-center text-gray-800">API Response</h1>
            <div class="space-y-6">
                <div class="bg-blue-50 border border-blue-200 rounded-lg p-4">
                    <h2 class="text-xl font-semibold mb-2 text-blue-800">Image Information</h2>
                    <p class="text-gray-700"><span class="font-semibold">Filename:</span> <span id="filename"></span>
                    </p>
                    <div class="mt-2 flex space-x-4">
                        <p class="text-gray-700"><span class="font-semibold">Latitude:</span> <span
                                id="latitude"></span></p>
                        <p class="text-gray-700"><span class="font-semibold">Longitude:</span> <span
                                id="longitude"></span></p>
                    </div>
                </div>

                <div class="bg-green-50 border border-green-200 rounded-lg p-4">
                    <h2 class="text-xl font-semibold mb-2 text-green-800">Analysis Result</h2>
                    <p class="text-gray-700"><span class="font-semibold">Response Level:</span> <span
                            id="response-level" class="text-lg font-bold"></span></p>
                </div>

                <div class="bg-yellow-50 border border-yellow-200 rounded-lg p-4">
                    <h2 class="text-xl font-semibold mb-2 text-yellow-800">Negative Components</h2>
                    <p id="negative-components" class="text-gray-700"></p>
                </div>

                <div class="bg-purple-50 border border-purple-200 rounded-lg p-4">
                    <h2 class="text-xl font-semibold mb-2 text-purple-800">Actionable Recommendations</h2>
                    <p id="actionable-recommendations" class="text-gray-700"></p>
                </div>
            </div>
        </div>
        <div id="response" class="mt-6 p-4 bg-gray-100 rounded-md hidden">
            <h2 class="text-lg font-semibold mb-2 text-gray-800">API Response:</h2>
            <pre id="jsonResponse" class="whitespace-pre-wrap break-words text-sm"></pre>
        </div>

        <script>
            function populateResponse(data) {
                document.getElementById("filename").textContent = data.filename;
                document.getElementById("latitude").textContent = data.latitude;
                document.getElementById("longitude").textContent = data.longitude;
                document.getElementById("response-level").textContent = data.response;
                document.getElementById("negative-components").textContent =
                    data.negative_components;
                document.getElementById("actionable-recommendations").textContent =
                    data.actionable_recommendations;
            }

            document
                .getElementById("uploadForm")
                .addEventListener("submit", async function (e) {
                    e.preventDefault();

                    const formData = new FormData();
                    formData.append("file", document.getElementById("image").files[0]);
                    formData.append("lat", document.getElementById("latitude").value);
                    formData.append("long", document.getElementById("longitude").value);

                    document.getElementById("loading").classList.remove("hidden");
                    document.getElementById("response").classList.add("hidden");

                    try {
                        const response = await fetch(
                            "http://127.0.0.1:8000/upload-image/",
                            {
                                method: "POST",
                                body: formData,
                            }
                        );

                        const data = await response.json();
                        document.getElementById("jsonResponse").textContent =
                            JSON.stringify(data, null, 2);
                        document.getElementById("response").classList.remove("hidden");
                        populateResponse(data);
                    } catch (error) {
                        console.error("Error:", error);
                        document.getElementById("jsonResponse").textContent =
                            "Error: " + error.message;
                        document.getElementById("response").classList.remove("hidden");
                    } finally {
                        document.getElementById("loading").classList.add("hidden");
                        document.getElementById("response2").classList.remove("hidden");
                        // document.getElementById("response").classList.remove("hidden");
                    }
                });
        </script>
</body>

</html>
